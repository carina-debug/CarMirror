name: APK derle

on:
  workflow_dispatch:
  push:
    paths:
      - CarMirror.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'ten çıkar
        run: unzip -q CarMirror.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        working-directory: CarMirror
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-apk
          path: CarMirror/app/build/outputs/apk/debug/app-debug.apk
